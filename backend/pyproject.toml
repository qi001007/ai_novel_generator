[project]
name = "novel-generator-backend"
version = "0.1.0"
description = "AI novel generation pipeline backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.14",
  "httpx==0.27.2",
  "sqlmodel==0.0.22",
  "alembic==1.14.0",
  "uvicorn[standard]==0.30.6",
  "python-dotenv==1.2.3",
  # §六 第 1 步（D-28）：循环交给框架，只自研网关方言适配器。传递依赖见 WORKSTREAM-PLAN §6.8。
  "pydantic-ai-slim[openai]==2.40.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "vulture==2.16"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
