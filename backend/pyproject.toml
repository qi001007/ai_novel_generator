[project]
name = "novel-generator-backend"
version = "0.1.0"
description = "AI novel generation pipeline backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.14",
  "httpx==0.27.2",
  "sqlmodel==0.0.22",
  "alembic==1.14.0",
  "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
